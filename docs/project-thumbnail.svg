      <stop stop-color="#090B24"/>
      <stop offset="1" stop-color="#17113A"/>
    </linearGradient>
    <linearGradient id="mazeGlow" x1="240" y1="160" x2="1040" y2="560" gradientUnits="userSpaceOnUse">

      <stop offset="0" stop-color="#A7B5FF" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#A7B5FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="0" y="0" width="1280" height="720" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="36"/>
